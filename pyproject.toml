[project]
name = "delve"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JaybhatiaPrimo", email = "jayant.bhatia@primotech.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141.1",
    "google-adk>=2.7.1",
    "litellm>=1.98.0",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
delve = "delve:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
]
